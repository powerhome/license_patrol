name: release-please

# Keeps a release pull request open against main that bumps the gem to the
# next version, pins it in Gemfile.lock and adds it to CHANGELOG.md, worked out
# from the Conventional Commit titles merged since the last release. Merging
# that pull request tags the release vX.Y.Z and creates its GitHub Release, and
# the tag's push publishes the gem. See release/instructions.md.
#
# It runs as the release GitHub App, not GITHUB_TOKEN: a pull request or tag
# GITHUB_TOKEN creates starts no workflows, so the release pull request would
# never get its required checks and the tag would never publish the gem. The
# App's key is in the release environment, which only main can deploy to, so
# no run from another branch or a tag can read it.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the release pull request, or tag a merged one
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
